name: Update Star History Chart

on:
  schedule:
    - cron: "0 0 * * *"   # 每天 UTC 00:00 跑一次
  workflow_dispatch:       # 也支持手动触发
  push:
    branches: [main]
    paths:
      - ".github/workflows/star-history.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest star history SVG (with token to bypass rate limit)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          # 用带 token 的请求获取 SVG（走 star-history 的 authorized 路径）
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.star-history.com/svg?repos=RuneFang/tvm_tilelang_cookbook&type=Date" \
            -o assets/star-history.svg
          ls -lh assets/star-history.svg

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/star-history.svg
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update star-history chart [skip ci]"
            git push
          fi
