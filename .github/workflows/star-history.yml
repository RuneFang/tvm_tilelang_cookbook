name: Update Star History Chart

on:
  schedule:
    - cron: "0 0 * * *"   # 每天 UTC 00:00 跑一次
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/star-history.yml"
      - "tools/gen_star_history.py"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate star history SVG (from GitHub API, no third party)
        env:
          # GITHUB_TOKEN 是每个 workflow run 自动注入的，只读公开数据完全够用
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/gen_star_history.py \
            --repo RuneFang/tvm_tilelang_cookbook \
            --out  assets/star-history.svg
          ls -lh assets/star-history.svg

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/star-history.svg
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update star-history chart [skip ci]"
            git push
          fi
