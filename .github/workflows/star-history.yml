name: Update Star History Chart

on:
  schedule:
    - cron: "0 0 * * *"   # 每天 UTC 00:00 跑一次
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/star-history.yml"
      - "tools/gen_star_history.py"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (only for the script)
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate star history SVG (from GitHub API, no third party)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out
          python3 tools/gen_star_history.py \
            --repo RuneFang/tvm_tilelang_cookbook \
            --tz   Asia/Shanghai \
            --out  out/star-history.svg
          ls -lh out/star-history.svg

      # 把生成好的 SVG 推到独立的 `chart` 分支
      # - 每次都是一个 orphan（无历史）分支强制覆盖，仓库里永远只有 1 个 commit
      # - main 分支完全不受影响，log 保持干净
      - name: Publish SVG to `chart` branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # 用一个全新的临时目录构建 chart 分支内容，避免污染 checkout 出来的 main
          WORK=$(mktemp -d)
          cp out/star-history.svg "$WORK/star-history.svg"

          # 顺手放一个极简 README 说明这个分支是干嘛的
          cat > "$WORK/README.md" <<'EOF'
          # chart branch

          This branch only stores auto-generated assets (e.g. `star-history.svg`).

          It is regenerated by `.github/workflows/star-history.yml` on `main` and
          force-pushed here as an orphan branch. **Do not commit anything here manually.**
          EOF

          cd "$WORK"
          git init -q -b chart
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "chore: auto-update star history chart"

          # 强制推送（--force），永远只保留最新的这一个 commit
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q --force origin chart
          echo "::notice::Published to https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/chart/star-history.svg"
